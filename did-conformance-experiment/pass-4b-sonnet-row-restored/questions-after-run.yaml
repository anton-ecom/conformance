# Live questions, to the owner of this suite. A channel, not a ledger.
#
# An answered question leaves this file. The answer lives in BRIEF.md, where it
# can be verified, and the account of what closed it lives in attack.yaml.
#
# A question does not block a gate. The runner reports how many are open and the
# owner decides whether to ship. Ninety per cent conformant and shipped beats
# one hundred per cent and stuck.

questions:
  - id: q1
    invariant: none
    status: open
    raised_by: reconstructor
    messages:
      - Uppercase hex is accepted and normalised to lowercase, so publicKeyFromDidKey(didKeyFromPublicKey(k)) is not the identity for uppercase input. That is the shape of the promise most callers depend on, and a vector names one operation, so it cannot be written down.
      - Three readings. Out of scope, which loses the strongest promise in the package. An obligation in the brief, checked by review and by nobody else. Or wait until the format can express a claim across two operations.
      - Nothing else in this suite is blocked by it.
    closed_at: null
  - id: q2
    invariant: RESOLVE-002
    status: open
    raised_by: builder
    messages:
      - When a DID URL (with a fragment, path or query) is refused, the brief does not say whether the message quotes the whole input or only the base DID after the delimiter is stripped. No vector distinguishes them, since every pinned refusal message has no delimiter in its input.
      - Reading A, the whole input as given. Reading B, the base DID only. The implementation quotes the whole input (A); it was a choice the vectors do not pin, so it is recorded here and not claimed.
    closed_at: null
